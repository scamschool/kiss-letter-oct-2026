<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A kiss for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffe6ee; --bg2:#ffd3e1;
  --env:#f9a8bf; --env-dark:#ec7f9f; --flap:#f58fae; --flap-in:#e5698f;
  --pocket-l:#fbb6c8; --pocket-b:#f89cb6;
  --card:#fffafc; --ink:#7a1f43; --ink-soft:#a54a69;
  --lip:#e8245f; --lip-dark:#b8123f; --heart:#ff4f86;
  --btn:#7a1f43; --btn-ink:#fff4f8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2b1322; --bg2:#3a1a2e;
    --env:#d9708f; --env-dark:#b94f73; --flap:#e0809c; --flap-in:#a8456a;
    --pocket-l:#e68aa4; --pocket-b:#d9708f;
    --card:#ffeef4; --ink:#ffd6e4; --ink-soft:#e8a3bc;
    --lip:#ff3d78; --lip-dark:#c71a50; --heart:#ff6b9a;
    --btn:#ffd6e4; --btn-ink:#4a1630;
  }
}
:root[data-theme="dark"]{
  --bg:#2b1322; --bg2:#3a1a2e;
  --env:#d9708f; --env-dark:#b94f73; --flap:#e0809c; --flap-in:#a8456a;
  --pocket-l:#e68aa4; --pocket-b:#d9708f;
  --card:#ffeef4; --ink:#ffd6e4; --ink-soft:#e8a3bc;
  --lip:#ff3d78; --lip-dark:#c71a50; --heart:#ff6b9a;
  --btn:#ffd6e4; --btn-ink:#4a1630;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:radial-gradient(circle at 50% 35%,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink);
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;overflow-x:hidden;text-align:center;
}
h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:600;margin:0;line-height:1.1}
.sub{margin:.5rem 0 0;font-size:1.1rem;color:var(--ink-soft);min-height:1.5em}

.stage{position:relative;margin-top:200px;width:min(74vw,300px)}
.envelope{
  position:relative;display:block;width:100%;aspect-ratio:3/2;padding:0;border:0;background:none;
  cursor:pointer;perspective:900px;-webkit-tap-highlight-color:transparent;
  animation:wiggle 2.8s ease-in-out infinite;
}
.envelope.open{animation:none}
.envelope:focus-visible{outline:3px solid var(--ink);outline-offset:8px;border-radius:16px}
.envelope>span{position:absolute;display:block}
.shadow{left:6%;right:6%;bottom:-18px;height:18px;border-radius:50%;background:rgba(122,31,67,.18);filter:blur(6px)}
.env-back{inset:0;background:var(--env-dark);border-radius:12px;z-index:1}
.card{
  left:8%;width:84%;bottom:8%;height:80%;z-index:2;background:var(--card);border-radius:8px;
  box-shadow:0 2px 8px rgba(122,31,67,.15);transition:transform .7s cubic-bezier(.3,1.2,.5,1) .45s;
}
.card::after{content:"";position:absolute;left:12%;right:12%;top:10px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--heart) 0 8px,transparent 8px 16px);opacity:.5}
.open .card{transform:translateY(-28%)}
.pocket{inset:0;z-index:3;border-radius:12px;overflow:hidden}
.pocket svg{width:100%;height:100%;display:block}
.flap{
  left:0;top:0;width:100%;height:55%;z-index:4;transform-origin:50% 0;background:var(--flap);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .7s ease-in-out,background-color .01s .35s,z-index 0s .35s;
}
.flap i{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-style:normal;color:var(--btn-ink);font-size:clamp(1.1rem,5vw,1.5rem);transition:opacity .15s .55s}
.open .flap{transform:scaleY(-1);background-color:var(--flap-in);z-index:1}
.open .flap i{opacity:0;transition-delay:0s}

/* kiss */
.kiss{
  left:50%;bottom:40%;width:40%;z-index:2;pointer-events:none;
  transform:translate(-50%,0) scale(.2);opacity:0;
}
.kiss-inner{position:relative;display:block;animation:none}
.kiss svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 6px rgba(184,18,63,.3))}
.bubble{
  position:absolute;left:92%;top:-10%;background:var(--card);color:var(--lip-dark);
  font-weight:600;font-size:1.05rem;padding:.2rem .7rem;border-radius:999px;white-space:nowrap;
  transform:scale(0) rotate(8deg);transform-origin:0 100%;box-shadow:0 2px 6px rgba(122,31,67,.18);
}
.open .kiss{animation:pop 1.1s .75s cubic-bezier(.3,1.4,.5,1) forwards}
.open .kiss-inner{animation:bob 2.2s 2s ease-in-out infinite alternate}
.open .bubble{animation:bubble .5s 1.7s cubic-bezier(.3,1.7,.5,1) forwards}

.hearts{position:absolute;left:50%;bottom:160%;width:0;height:0;pointer-events:none}
.heart{
  position:absolute;left:0;top:0;color:var(--heart);font-size:var(--s);line-height:1;
  opacity:0;animation:rise 2.3s ease-out var(--d) forwards;
}

.again{
  margin-top:48px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:.7rem 1.5rem;
  visibility:hidden;opacity:0;transition:opacity .4s;
}
.again.show{visibility:visible;opacity:1}
.again:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.note{margin-top:34px;max-width:min(88vw,360px);background:var(--card);border-radius:20px;padding:1rem 1.25rem;box-shadow:0 4px 14px rgba(122,31,67,.16);opacity:0;transform:translateY(10px);visibility:hidden}
.note p{margin:0;font-size:1.25rem;font-weight:600;line-height:1.35;color:#7a1f43}
.note .from{margin-top:.5rem;font-size:1rem;font-weight:500;color:#a54a69}
.opened .note{visibility:visible;animation:fadeUp .6s 1.6s ease-out forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-2.5deg)}82%{transform:rotate(2.5deg)}88%{transform:rotate(-1.5deg)}94%{transform:rotate(1deg)}}
@keyframes pop{
  0%{transform:translate(-50%,0) scale(.2);opacity:0}
  55%{transform:translate(-50%,-300%) scale(1.2) rotate(-9deg);opacity:1}
  100%{transform:translate(-50%,-290%) scale(1) rotate(-4deg);opacity:1}
}
@keyframes bob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-8px) rotate(3deg)}}
@keyframes bubble{to{transform:scale(1) rotate(8deg)}}
@keyframes rise{
  0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}
  15%{opacity:1}
  100%{transform:translate(var(--x),-130px) scale(1) rotate(var(--r));opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .envelope{animation:none}
  .card,.flap{transition:none}
  .open .kiss{animation:none;transform:translate(-50%,-290%) scale(1) rotate(-4deg);opacity:1}
  .open .kiss-inner{animation:none}
  .open .bubble{animation:none;transform:scale(1) rotate(8deg)}
  .heart{display:none}
  .opened .note{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
  <header>
    <h1 id="title">You've got mail</h1>
    <p class="sub" id="sub" aria-live="polite">Tap the envelope to open it</p>
  </header>

  <div class="stage">
    <button class="envelope" id="env" type="button" aria-expanded="false" aria-label="Open the envelope">
      <span class="shadow"></span>
      <span class="env-back"></span>
      <span class="card"></span>
      <span class="kiss">
        <span class="kiss-inner">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <path d="M10 40C30 15 50 20 60 30C70 20 90 15 110 40C90 45 75 48 60 48C45 48 30 45 10 40Z" fill="var(--lip)"/>
            <path d="M10 40C30 45 45 48 60 48C75 48 90 45 110 40C100 65 80 72 60 72C40 72 20 65 10 40Z" fill="var(--lip)"/>
            <path d="M10 40C30 45 45 48 60 48C75 48 90 45 110 40" fill="none" stroke="var(--lip-dark)" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="60" cy="60" rx="16" ry="5" fill="#fff" opacity=".35"/>
            <ellipse cx="38" cy="32" rx="8" ry="3" fill="#fff" opacity=".3" transform="rotate(-20 38 32)"/>
          </svg>
          <span class="bubble">mwah!</span>
        </span>
      </span>
      <span class="pocket">
        <svg viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 0L150 112L0 200Z" fill="var(--pocket-l)"/>
          <path d="M300 0L150 112L300 200Z" fill="var(--pocket-l)"/>
          <path d="M0 200L150 96L300 200Z" fill="var(--pocket-b)"/>
        </svg>
      </span>
      <span class="flap"><i>♥</i></span>
    </button>
    <div class="hearts" id="hearts" aria-hidden="true"></div>
  </div>

  <div class="note" id="note">
    <p>I love you very very much Gia Khánh</p>
    <p class="from">- From your dearest Wei An</p>
  </div>

  <button class="again" id="again" type="button">Send another kiss</button>

<script>
(function(){
  var env=document.getElementById('env'),hearts=document.getElementById('hearts'),
      again=document.getElementById('again'),title=document.getElementById('title'),
      sub=document.getElementById('sub');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers=[];

  function burst(n,delay){
    if(reduce)return;
    for(var i=0;i<n;i++){
      var h=document.createElement('span');
      h.className='heart';
      h.textContent='♥';
      h.style.setProperty('--x',(Math.random()*180-90).toFixed(0)+'px');
      h.style.setProperty('--r',(Math.random()*60-30).toFixed(0)+'deg');
      h.style.setProperty('--s',(14+Math.random()*14).toFixed(0)+'px');
      h.style.setProperty('--d',(delay+i*0.12).toFixed(2)+'s');
      hearts.appendChild(h);
      (function(el){setTimeout(function(){el.remove()},(delay+n*0.12+2.5)*1000)})(h);
    }
  }
  function openIt(){
    env.classList.add('open');document.body.classList.add('opened');
    env.setAttribute('aria-expanded','true');
    env.setAttribute('aria-label','Send more hearts');
    title.textContent='A kiss for you';
    sub.textContent='Tap the envelope for more hearts';
    burst(14,1.1);
    timers.push(setTimeout(function(){again.classList.add('show')},2200));
  }
  function reset(){
    timers.forEach(clearTimeout);timers=[];
    env.classList.remove('open');document.body.classList.remove('opened');
    env.setAttribute('aria-expanded','false');
    env.setAttribute('aria-label','Open the envelope');
    again.classList.remove('show');
    hearts.innerHTML='';
    title.textContent="You've got mail";
    sub.textContent='Tap the envelope to open it';
  }
  env.addEventListener('click',function(){
    if(env.classList.contains('open')) burst(8,0); else openIt();
  });
  again.addEventListener('click',function(){reset();env.focus();});
})();
</script>
</body>
</html>
